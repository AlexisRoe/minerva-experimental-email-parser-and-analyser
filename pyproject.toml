[project]
name = "minerva-email-parser"
version = "0.1.0"
description = "Test lab for parsing and analysing emails in Python without the overhead of Minerva"
readme = "README.md"
authors = [
    { name = "AlexisRoe", email = "a.roehrling@gmx.de" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "email-validator>=2.3.0",
    "mail-parser>=4.6.5",
    # Add runtime deps with `uv add <pkg>`
    "phonenumbers>=9.0.39",
    "pydantic>=2.13.5",
    "questionary>=2.1.1",
    "urlextract>=1.9.0",
]

[project.scripts]
minerva-email-parser = "minerva_email_parser.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minerva_email_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
