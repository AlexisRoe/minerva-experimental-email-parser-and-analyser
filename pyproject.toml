[project]
name = "minerva-email-parser"
version = "0.1.0"
description = "Test lab for parsing and analysing emails in Python without the overhead of Minerva"
readme = "README.md"
authors = [
    { name = "AlexisRoe", email = "a.roehrling@gmx.de" }
]
requires-python = ">=3.12"
dependencies = [
    # Add runtime deps with `uv add <pkg>`
]

[project.scripts]
minerva-email-parser = "minerva_email_parser.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minerva_email_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
